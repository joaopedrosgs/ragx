[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragx"
version = "0.1.0"
description = "Export Ragnarok Online client assets to open formats: maps to glTF 2.0, sprites and effects to PNG + JSON, UI to transparent PNG."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "João Pedro" }]
keywords = ["ragnarok", "gltf", "grf", "rsm", "rsw", "spr", "converter", "gamedev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/joaopedrosgs/ragx"
Repository = "https://github.com/joaopedrosgs/ragx"
Issues = "https://github.com/joaopedrosgs/ragx/issues"

[project.scripts]
ragx = "ragx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ragx"]

[tool.hatch.build.targets.sdist]
include = [
    "/ragx",
    "/README.md",
    "/LICENSE",
]
